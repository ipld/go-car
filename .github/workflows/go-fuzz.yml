on: [ push, pull_request ]
name: Go Fuzz

jobs:
  v1:
    strategy:
      fail-fast: true
      matrix:
        target: [ "CarReader" ]
    runs-on: ubuntu-latest
    name: Fuzz V1 ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Go information
        run: |
          go version
          go env
      - name: Run Fuzzing for 1m
        run: go test -v -fuzz=Fuzz${{ matrix.target }} -fuzztime=1m .
  v2:
    strategy:
      fail-fast: true
      matrix:
        target: [ "BlockReader", "Reader", "Inspect" ]
    runs-on: ubuntu-latest
    name: Fuzz V2 ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: v2/go.mod
      - name: Go information
        run: |
          go version
          go env
      - name: Run Fuzzing for 1m
        run: |
          cd v2
          go test -v -fuzz=Fuzz${{ matrix.target }} -fuzztime=1m .
