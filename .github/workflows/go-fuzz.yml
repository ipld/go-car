on: [ push, pull_request ]
name: Go Fuzz

jobs:
  v1:
    strategy:
      fail-fast: true
      matrix:
        target: [ "CarReader" ]
    runs-on: ubuntu-latest
    name: Fuzz V1 ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
      - name: Go information
        run: |
          go version
          go env
      - name: Run Fuzzing for 1m
        run: go test -v -fuzz=Fuzz${{ matrix.target }} -fuzztime=1m .
  v2:
    strategy:
      fail-fast: true
      matrix:
        target: [ "BlockReader", "Reader", "Inspect" ]
    runs-on: ubuntu-latest
    name: Fuzz V2 ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
      - name: Go information
        run: |
          go version
          go env
      - name: Run Fuzzing for 1m
        run: |
          cd v2
          go test -v -fuzz=Fuzz${{ matrix.target }} -fuzztime=1m .
